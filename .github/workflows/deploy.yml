name: Build and Deploy

# Publishes the released site to the root of qsmbly.neurodesk.org, and leaves the staging subtree
# alone. Staging is deployed separately by deploy-staging.yml, on every push to the staging branch.

on:
  # Build and deploy on release
  release:
    types: [published]
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (without v prefix, e.g., 0.3.0)'
        required: false
        default: ''

permissions:
  contents: read

# One deploy at a time: the released site and staging share a branch, and each deploy rewrites it.
concurrency:
  group: "pages-branch"
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Extract version from release tag (remove 'v' prefix)
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            # Use manually provided version
            VERSION="${{ github.event.inputs.version }}"
          else
            # Fallback: read from config.js
            VERSION=$(grep -oP "^export const VERSION = '\K[^']+" js/app/config.js || echo "0.0.0")
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

  deploy:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/build-pages.yml
    with:
      ref: main
      version: ${{ needs.version.outputs.VERSION }}
      # The root of the site; staging/ belongs to the other workflow and must survive this deploy.
      subtree: ''
      keep: staging
      release-tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      message: Deploy ${{ needs.version.outputs.VERSION }} to the site root
