name: Build and Deploy

on:
  # Build and deploy on release
  release:
    types: [published]
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (without v prefix, e.g., 0.3.0)'
        required: false
        default: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write  # upload build artifacts to the release (not for committing source)
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Extract version from release tag (remove 'v' prefix)
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            # Use manually provided version
            VERSION="${{ github.event.inputs.version }}"
          else
            # Fallback: read from config.js
            VERSION=$(grep -oP "^export const VERSION = '\K[^']+" js/app/config.js || echo "0.0.0")
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Stamp version into the build (working tree only — never committed)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty"
            exit 1
          fi

          # These files ship 0.0.0 placeholders in git; the real version comes from the
          # release tag and is injected here at build time only (no commit, no tag move).
          sed -i "s/^export const VERSION = '[^']*'/export const VERSION = '$VERSION'/" js/app/config.js
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" rust-wasm/Cargo.toml

          # QSM.rs core version comes from the pinned qsm-core dependency tag.
          QSM_RS_VERSION=$(grep 'qsm-core' rust-wasm/Cargo.toml | grep -oP 'tag = "v\K[^"]+' || echo "")
          if [ -n "$QSM_RS_VERSION" ]; then
            sed -i "s/^export const QSM_RS_VERSION = '[^']*'/export const QSM_RS_VERSION = '$QSM_RS_VERSION'/" js/app/config.js
            echo "Stamped QSM.rs version $QSM_RS_VERSION"
          fi

          echo "Stamped app version $VERSION into the build"

      - name: Setup Rust (nightly + rust-src for wasm threads build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build WASM (threaded base + DL bundles; runs generate-defaults, copies to wasm/)
        run: ./build.sh --simd

      - name: Upload WASM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            wasm/qsm_wasm.js wasm/qsm_wasm_bg.wasm \
            wasm/qsm_wasm_dl.js wasm/qsm_wasm_dl_bg.wasm \
            --clobber

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/wasm

          # Copy static files
          cp index.html deploy/
          cp -r js deploy/
          cp -r css deploy/

          # Copy favicon/logo files if they exist
          cp QSMbly.png deploy/ 2>/dev/null || true
          cp favicon.ico deploy/ 2>/dev/null || true
          cp icon.svg deploy/ 2>/dev/null || true

          # Copy landing page imagery
          cp -r assets deploy/ 2>/dev/null || true

          # Copy niivue and nifti-js
          cp -r niivue deploy/
          cp -r nifti-js deploy/

          # Copy dcm2niix WASM module (DICOM conversion)
          cp -r dcm2niix deploy/

          # Copy the built WASM bundles (base + DL + romeo) plus the
          # wasm-bindgen-rayon worker snippets that build.sh emitted into wasm/.
          cp -r wasm/. deploy/wasm/

          # coi-serviceworker installs COOP/COEP client-side so SharedArrayBuffer
          # (wasm threads) works on GitHub Pages, which can't set those headers.
          cp coi-serviceworker.js deploy/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
