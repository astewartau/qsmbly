name: CI

# Builds the wasm crate and runs the Rust + JS test suites on every PR/push.
# The wasm build is the important guard: it catches qsm-core / qsmxt-engine API
# breakage — including on the automated qsmxt-engine pin-bump PRs.
on:
  pull_request:
  push:
    branches: [main, staging]
  # The qsmxt-engine bump workflow dispatches this on its PR branch: PRs it opens with the
  # workflow token trigger no pull_request runs.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Build (wasm32) + Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-wasm

      - name: Build for wasm32
        working-directory: rust-wasm
        run: cargo build --target wasm32-unknown-unknown

      - name: Rust tests (native)
        working-directory: rust-wasm
        run: cargo test

      - name: rustfmt
        working-directory: rust-wasm
        run: cargo fmt --check

      - name: clippy
        working-directory: rust-wasm
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  deploy-build:
    name: Deploy build (nightly, threads + onnx + SIMD) + defaults sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bundle is a function of the Rust crate (its source, Cargo.toml and Cargo.lock, so the
      # qsmxt-engine pin too), build.sh, the toolchain action and this workflow. When none of
      # those changed, reuse the bundle a previous run built from the same inputs, and skip the
      # ~10 min build: a JS-only change goes straight to the round trip and the smoke tests.
      # Pushes to main always rebuild, so the floating nightly is still built against on every
      # merge, and they refresh the bundle PRs restore.
      #
      # The key is taken once, here: after the build, rust-wasm/ also holds target/ and pkg/, and
      # hashing it again would give the saved bundle a key no later run looks up.
      - name: Key the bundle on its inputs
        id: key
        run: echo "key=wasm-bundle-${{ hashFiles('rust-wasm/**', 'build.sh', '.github/actions/setup-wasm-build/**', '.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore a bundle built from the same inputs
        id: bundle
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: |
            wasm/
            rust-wasm/pkg/
          key: ${{ steps.key.outputs.key }}

      # The same toolchain build-pages.yml deploys with.
      - if: steps.bundle.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-wasm-build

      # The compiled dependencies, for when the bundle has to be rebuilt. Not rust-cache: build.sh
      # rebuilds std (-Z build-std), and rust-cache prunes what is not in Cargo.lock, std included,
      # so every crate recompiled even on a full cache match. This keeps target/ whole instead.
      # Cargo rebuilds anything whose compiler changed, so the key starts with the nightly's own
      # commit: a newer nightly misses rather than restoring artifacts it cannot use.
      - name: Key the compiled dependencies on the nightly
        id: nightly
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          echo "rustc=$(rustc +nightly -vV | sed -n 's/^commit-hash: //p' | head -c 12)" >> "$GITHUB_OUTPUT"

      - if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: rust-wasm/target
          key: wasm-target-${{ steps.nightly.outputs.rustc }}-${{ hashFiles('rust-wasm/Cargo.lock', 'build.sh') }}
          restore-keys: wasm-target-${{ steps.nightly.outputs.rustc }}-

      # Cargo decides whether std is stale by the mtimes of its sources, and the toolchain is
      # installed afresh each run, so its sources are always newer than the cached std and every
      # crate rebuilt (measured: a restored target still recompiled all 253 crates). The key pins
      # the nightly, so the sources are the ones the cache was built from: date them back.
      - name: Let the cached std count as fresh
        if: steps.bundle.outputs.cache-hit != 'true'
        run: find "$(rustc +nightly --print sysroot)/lib/rustlib/src" -exec touch -h -d '2000-01-01' {} +

      # Exactly what a deploy runs: both bundles, threaded, with every feature the site ships.
      - name: Build WASM as deployed
        if: steps.bundle.outputs.cache-hit != 'true'
        run: ./build.sh --simd

      - name: Keep the bundle for runs with the same inputs
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            wasm/
            rust-wasm/pkg/
          key: ${{ steps.key.outputs.key }}

      # Node for the steps below, which the toolchain action sets up only when it runs.
      - if: steps.bundle.outputs.cache-hit == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # build.sh regenerates js/app/qsm-defaults.js from the freshly built wasm; a diff means the
      # committed copy has drifted from the Rust defaults.
      - name: Check generated defaults are committed
        run: |
          node scripts/generate-defaults.mjs
          git diff --exit-code js/app/qsm-defaults.js \
            || { echo "::error::js/app/qsm-defaults.js is out of date; run ./build.sh (or node scripts/generate-defaults.mjs after a build) and commit it"; exit 1; }

      - run: npm ci

      # The UI settings -> qsmxt-engine round trip needs the built bundle, so the plain jest job
      # skips it. Here it must run: QSMBLY_REQUIRE_WASM turns a missing bundle into a failure.
      - name: ConfigBridge round trip through the built qsmxt-engine schema
        env:
          QSMBLY_REQUIRE_WASM: '1'
        run: npm test -- js/modules/ConfigBridge.roundtrip.test.js

      # The browser smoke tests run the new workspace on this bundle.
      - name: Keep the bundle for the smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: wasm/
          retention-days: 1
          if-no-files-found: error

  js:
    name: JS lint + tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  e2e:
    name: Browser smoke tests (Playwright)
    runs-on: ubuntu-latest
    # next.html asks QSMxT's engine through the bundle the deploy build made.
    needs: deploy-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: wasm/

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs in the runner's preinstalled Chrome (playwright.config.js), with WebGL on SwiftShader.
      # The example-data test downloads from Hugging Face, so it runs locally, not here.
      - name: Smoke tests
        env:
          QSMBLY_E2E_OFFLINE: '1'
        run: npm run test:e2e

      - name: Keep screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
