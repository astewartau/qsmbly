name: CI

# Builds the wasm crate and runs the Rust + JS test suites on every PR/push.
# The wasm build is the important guard: it catches qsm-core / qsmxt-engine API
# breakage — including on the automated qsmxt-engine pin-bump PRs.
on:
  pull_request:
  push:
    branches: [main, staging]
  # The qsmxt-engine bump workflow dispatches this on its PR branch: PRs it opens with the
  # workflow token trigger no pull_request runs.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Build (wasm32) + Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-wasm

      - name: Build for wasm32
        working-directory: rust-wasm
        run: cargo build --target wasm32-unknown-unknown

      - name: Rust tests (native)
        working-directory: rust-wasm
        run: cargo test

      - name: rustfmt
        working-directory: rust-wasm
        run: cargo fmt --check

      - name: clippy
        working-directory: rust-wasm
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  deploy-build:
    name: Deploy build (nightly, threads + onnx + SIMD) + defaults sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same toolchain build-pages.yml deploys with.
      - uses: ./.github/actions/setup-wasm-build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-wasm

      # Exactly what a deploy runs: both bundles, threaded, with every feature the site ships.
      - name: Build WASM as deployed
        run: ./build.sh --simd

      # build.sh regenerates js/app/qsm-defaults.js from the freshly built wasm; a diff means the
      # committed copy has drifted from the Rust defaults.
      - name: Check generated defaults are committed
        run: |
          node scripts/generate-defaults.mjs
          git diff --exit-code js/app/qsm-defaults.js \
            || { echo "::error::js/app/qsm-defaults.js is out of date; run ./build.sh (or node scripts/generate-defaults.mjs after a build) and commit it"; exit 1; }

      - run: npm ci

      # The UI settings -> qsmxt-engine round trip needs the built bundle, so the plain jest job
      # skips it. Here it must run: QSMBLY_REQUIRE_WASM turns a missing bundle into a failure.
      - name: ConfigBridge round trip through the built qsmxt-engine schema
        env:
          QSMBLY_REQUIRE_WASM: '1'
        run: npm test -- js/modules/ConfigBridge.roundtrip.test.js

      # The browser smoke tests run the new workspace on this bundle.
      - name: Keep the bundle for the smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: wasm/
          retention-days: 1
          if-no-files-found: error

  js:
    name: JS lint + tests (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  e2e:
    name: Browser smoke tests (Playwright)
    runs-on: ubuntu-latest
    # next.html asks QSMxT's engine through the bundle the deploy build made.
    needs: deploy-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: wasm/

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs in the runner's preinstalled Chrome (playwright.config.js), with WebGL on SwiftShader.
      # The example-data test downloads from Hugging Face, so it runs locally, not here.
      - name: Smoke tests
        env:
          QSMBLY_E2E_OFFLINE: '1'
        run: npm run test:e2e

      - name: Keep screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
