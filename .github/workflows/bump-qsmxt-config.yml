name: Bump qsmxt-config pin

# Opens a PR pinning rust-wasm/Cargo.toml's qsmxt-config to a new QSMxT/QSMxT
# release tag whenever QSMxT publishes a release (it fires a repository_dispatch).
# Can also be run manually with a specific version.
#
# qsmxt-config is qsmbly's only pin on the QSM stack: it re-exports qsm-core, so moving this one
# tag also moves qsm-core to the version that QSMxT release was built with.
#
# A PR opened with the workflow's GITHUB_TOKEN triggers no `pull_request` workflows, so CI would
# never run on it. workflow_dispatch is the exception GitHub makes for GITHUB_TOKEN, so after
# opening the PR this dispatches ci.yml on the bump branch; its checks land on the branch's head
# commit and show on the PR like any other CI run.
on:
  repository_dispatch:
    types: [qsmxt-config-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'QSMxT release tag to pin (e.g. v9.3.0)'
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch ci.yml on the bump branch

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inputs reach the shell only through env vars, never by ${{ }} interpolation into the
      # script, and must look like a release tag before they are used anywhere.
      - name: Resolve target version
        id: ver
        env:
          V: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          if [ -z "$V" ]; then echo "no version provided" >&2; exit 1; fi
          if ! [[ "$V" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "version '$V' is not a release tag (expected e.g. v9.3.0)" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Pin qsmxt-config to the release tag in Cargo.toml
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          # qsmxt-config lives in the QSMxT/QSMxT workspace; replace whatever
          # git ref is pinned (rev or tag) with the new release tag.
          sed -i -E 's#(qsmxt-config = \{ git = "https://github.com/QSMxT/QSMxT.git", )(rev|tag) = "[^"]+"#\1tag = "'"${V}"'"#' rust-wasm/Cargo.toml
          grep -F 'qsmxt-config' rust-wasm/Cargo.toml | grep -qF "tag = \"${V}\"" \
            || { echo "qsmxt-config pin was not updated" >&2; exit 1; }
          grep qsmxt-config rust-wasm/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        working-directory: rust-wasm
        # Update only qsmxt-config (and the qsm-core it now requires); a failure here should
        # stop the bump, not silently update every other dependency instead.
        run: cargo update -p qsmxt-config

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Bump qsmxt-config to ${{ steps.ver.outputs.version }}"
          branch: bump-qsmxt-config-${{ steps.ver.outputs.version }}
          title: "Bump qsmxt-config to ${{ steps.ver.outputs.version }}"
          body: |
            Automated pin bump triggered by a QSMxT release
            (**${{ steps.ver.outputs.version }}**).

            Pins `rust-wasm/Cargo.toml` (+ `Cargo.lock`) to the new QSMxT/QSMxT
            release tag. qsm-core comes with it (qsmxt-config re-exports it), so
            this is the only pin to move. Review, then merge — the GitHub Pages
            deploy runs when you cut the next qsm-wasm release.

            CI is dispatched on this branch by the bump workflow (a PR opened with
            the workflow token triggers no `pull_request` runs); its checks appear
            below once they start.
          labels: dependencies

      - name: Run CI on the bump branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bump-qsmxt-config-${{ steps.ver.outputs.version }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
